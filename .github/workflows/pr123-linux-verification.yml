name: PR 124 exact SHA Linux verification

on:
  push:
    branches: [ci/pr124-linux-verification]

permissions:
  contents: read

jobs:
  linux-financial-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 93ba9b87318b21401737ec8a0eeb86d357998228
      BASE_SHA: b1f93efaad93379c22f041ffbcaa3bacbeabfd24
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:39473
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-test-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: synthetic-test-service-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:39472
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify SHA and Linux x64 environment
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          printf '%s\n' "$PRETTY_NAME"
          uname -sm
          getconf GNU_LIBC_VERSION
          node --version
          npm --version
          node -e 'const a=require("node:assert/strict"); a.equal(process.platform,"linux"); a.equal(process.arch,"x64"); a.ok(process.report.getReport().header.glibcVersionRuntime); a.equal(process.versions.node.split(".")[0],"22")'

      - name: Clean npm ci from lockfile
        shell: bash
        run: |
          test ! -e node_modules
          npm ci --no-audit --no-fund
          git diff --exit-code -- package-lock.json package.json
          sha256sum package-lock.json

      - name: TypeScript
        id: typescript
        run: ./node_modules/.bin/tsc --noEmit

      - name: Financial regressions
        run: npm run test:accrual

      - name: Isolated PostgreSQL regressions
        id: postgres-tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-local-postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { Client } = require("pg");
          (async () => {
            const url = new URL(process.env.TEST_DATABASE_URL);
            assert.equal(url.protocol, "postgresql:");
            assert.equal(url.hostname, "127.0.0.1");
            assert.equal(url.pathname, "/postgres");
            const db = new Client({ connectionString: url.href });
            await db.connect();
            try {
              const result = await db.query("show server_version");
              const version = result.rows[0].server_version;
              assert.match(version, /^17\./);
              console.log("Isolated PostgreSQL " + version);
            } finally {
              await db.end();
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
          npm run test:db

      - name: Production build with Turbopack
        if: ${{ !cancelled() && steps.typescript.outcome == 'success' }}
        run: npm run build -- --turbopack

      - name: Confirm tested SHA and tracked source
        if: ${{ !cancelled() && steps.typescript.outcome == 'success' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code HEAD --

      - name: Diagnose PostgreSQL failures against BASE
        if: ${{ !cancelled() && steps.postgres-tests.outcome == 'failure' }}
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-local-postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
        shell: bash
        run: |
          base_checkout="$RUNNER_TEMP/pr124-base-verification"
          git worktree add --detach "$base_checkout" "$BASE_SHA"
          cd "$base_checkout"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          printf 'Diagnostic BASE checkout %s\n' "$(git rev-parse HEAD)"
          npm ci --no-audit --no-fund
          if npm run test:db > "$RUNNER_TEMP/pr124-baseline-postgresql.log" 2>&1; then
            baseline_result=0
          else
            baseline_result=$?
          fi
          printf 'BASE npm run test:db exit status: %s\n' "$baseline_result"
          grep -E 'ℹ (tests|pass|fail)|✖|задокументированное|actual:|expected:' \
            "$RUNNER_TEMP/pr124-baseline-postgresql.log" || true
